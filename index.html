<!doctype html>
<html lang="ru">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta
			name="description"
			content="Приглашение на свадьбу Александра и Катрины. 24 октября 2026 года, Краснодар."
		/>
		<title>Александр и Катрина — 24.10.2026</title>
		<link rel="stylesheet" href="css/style.css" />
	</head>
	<body>
		<main>
			<audio
				id="wedding-music"
				src="./audio/wedding.mp3"
				loop
				preload="auto"
			></audio>
			<section class="hero" aria-labelledby="wedding-title">
				<div class="visually-hidden">
					<h1 id="wedding-title">Александр и Катрина</h1>
					<p>
						Приглашаем вас на свадьбу
						<time datetime="2026-10-24">24 октября 2026 года</time>. Краснодар.
					</p>
				</div>

				<div class="hero__composition">
					<img
						class="hero__image"
						src="images/hero-mobile.jpg"
						width="791"
						height="1363"
						alt=""
						fetchpriority="high"
					/>
				</div>

				<img
					class="hero__scroll"
					src="images/scroll-down.svg"
					width="24"
					height="28"
					alt=""
					aria-hidden="true"
				/>
			</section>
			<!-- Здесь будут следующие секции приглашения. -->
		</main>
		<script src="./js/music.js" defer></script>
	</body>
</html>
